name: Verify Xyra Atlas

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Validate curriculum and build
        run: npm run check
      - name: Audit static art accessibility and offline bundle budget
        run: npm run audit:assets
      - name: Archive static asset budget evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: xyra-atlas-static-asset-audit
          path: artifacts/static-asset-audit.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Audit lesson pedagogy and source inventory
        run: npm run audit:curriculum
      - name: Save curriculum audit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: xyra-atlas-curriculum-audit
          path: artifacts/curriculum-audit.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Export independent editorial review packet
        run: npm run export:editorial
      - name: Save reviewer packet (not an approval)
        uses: actions/upload-artifact@v7
        with:
          name: xyra-atlas-editorial-review-packet
          path: |
            artifacts/editorial-review-packet.json
            artifacts/editorial-review-packet.html
          retention-days: 14
      - name: Audit supplied independent editorial attestations
        run: npm run audit:editorial
      - name: Archive editorial approval provenance status
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: xyra-atlas-editorial-attestation-audit
          path: artifacts/editorial-attestation-audit.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Export qualified language reviewer workbook
        run: npm run export:language-review
      - name: Archive language reviewer workbook
        uses: actions/upload-artifact@v7
        with:
          name: xyra-atlas-language-review
          path: |
            artifacts/language-review-packet.json
            artifacts/language-review-workbook.md
          retention-days: 14
      - name: Verify offline artifacts
        run: |
          test -s dist/index.html
          test -s dist/sw.js
          test -s dist/data.js
          test -s dist/lifepractice.js
          test -s dist/masterytracks.js
          test -s dist/languagechallenge.js
          test -s dist/conversationquest.js
          test -s dist/datacontrols.js
          test -s dist/voicecoach.js
          test -s dist/phrasereview.js
          test -s dist/examhistory.js
          test -s dist/focusedexam.js
          test -s dist/capstonelabs.js
          test -s dist/capstonechecks.js
          test -s dist/assets/atlas-archive-gate.svg
          test -s dist/assets/atlas-lantern-library.svg
          test -s dist/assets/atlas-starlit-garden.svg
          test -s dist/chapterart.js
          test -s dist/assets/chapter-privacy-observatory.svg
          test -s dist/assets/chapter-security-sanctum.svg
          test -s dist/assets/chapter-business-atelier.svg
          test -s dist/assets/chapter-science-glasshouse.svg
          test -s dist/assets/chapter-interpretation-crossroads.svg
          test -s dist/assets/chapter-cash-weatherhouse.svg
          test -s dist/assets/chapter-clockwork-schedule.svg
          test -s dist/assets/chapter-language-teahouse.svg
          test -s dist/assets/chapter-feedback-bridge.svg
          test -s dist/assets/chapter-evidence-prism.svg
          test -s dist/assets/chapter-portfolio-forge.svg
          test -s dist/assets/chapter-boundary-garden.svg
          test -s dist/assets/chapter-offer-market.svg
          test -s dist/assets/chapter-protective-lantern.svg
          test -s dist/visualmap.js
          test -s dist/narration.js
          test -s dist/storagehealth.js
          test -s dist/casebook.js
          test -s dist/icon-192.png
          test -s dist/icon-512.png
          test -s dist/apple-touch-icon.png
      - name: Install Chromium smoke-test tooling (test-only)
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Exercise built PWA in desktop and mobile Chromium
        run: npm run test:browser
      - name: Save browser smoke screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: xyra-atlas-browser-smoke
          path: artifacts/browser/
          if-no-files-found: ignore
          retention-days: 7
      - name: Install WebKit browser for cross-engine checks
        run: npx playwright install --with-deps webkit
      - name: Exercise mobile and desktop WebKit engine
        run: npm run test:webkit
      - name: Save WebKit visual evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: xyra-atlas-webkit-screenshots
          path: artifacts/browser-webkit/
          if-no-files-found: ignore
          retention-days: 7
      - name: Save deployable website
        uses: actions/upload-artifact@v7
        with:
          name: xyra-atlas-static-site
          path: dist/
          retention-days: 7
