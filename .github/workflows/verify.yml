name: Verify Xyra Atlas

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Validate curriculum and build
        run: npm run check
      - name: Verify offline artifacts
        run: |
          test -s dist/index.html
          test -s dist/sw.js
          test -s dist/data.js
          test -s dist/lifepractice.js
          test -s dist/visualmap.js
          test -s dist/narration.js
          test -s dist/storagehealth.js
          test -s dist/casebook.js
          test -s dist/icon-192.png
          test -s dist/icon-512.png
          test -s dist/apple-touch-icon.png
      - name: Save deployable website
        uses: actions/upload-artifact@v7
        with:
          name: xyra-atlas-static-site
          path: dist/
          retention-days: 7
