 <linearGradient id="hair" x1="0" x2="1" y2="1"><stop stop-color="#10122c"/><stop offset=".42" stop-color="#231638"/><stop offset=".74" stop-color="#43305d"/><stop offset="1" stop-color="#16132e"/></linearGradient>
 <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffe1cb"/><stop offset=".55" stop-color="#f1bcae"/><stop offset="1" stop-color="#d9999b"/></linearGradient>
 <linearGradient id="dress" x1="0" x2="1" y2="1"><stop stop-color="#a17cce"/><stop offset=".5" stop-color="#5a3b88"/><stop offset="1" stop-color="#24143e"/></linearGradient>
 <linearGradient id="gold" x1="0" x2="1" y2=".4"><stop stop-color="#ffecb9"/><stop offset=".5" stop-color="#ce9949"/><stop offset="1" stop-color="#ffdf92"/></linearGradient>
 <radialGradient id="gem"><stop stop-color="#e7bdff"/><stop offset=".45" stop-color="#ab67e8"/><stop offset="1" stop-color="#4f267f"/></radialGradient>
 <radialGradient id="moon"><stop stop-color="#fff4d2"/><stop offset=".4" stop-color="#e8d7fe"/><stop offset="1" stop-color="#bc9bd7" stop-opacity="0"/></radialGradient>
 <filter id="halo"><feGaussianBlur stdDeviation="18"/></filter>
