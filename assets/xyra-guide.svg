<title id="xyraTitle">Xyra, the amethyst guide of Atlas</title>
<desc id="xyraDesc">Original illustrated fantasy woman with violet eyes, long dark hair with lavender highlights, natural human ears, gold amethyst crown, and embroidered purple clothes, against a moonlit sky.</desc>
<defs>
